<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiet River · 私人阅读工作台</title><link rel="stylesheet" href="/desk/style.css"><script src="/desk/app.js" defer></script></head>
<body><div id="login" hidden><form id="login-form"><span class="eyebrow">PRIVATE READING SPACE</span><h1>让值得读的内容<br>回到你面前。</h1><p>使用现有 Quiet River 访问口令进入。关注、笔记与推荐都由你掌握。</p><label>访问口令<input type="password" name="token" required autocomplete="current-password"></label><button type="submit">进入阅读工作台</button><p id="login-error" role="alert"></p></form></div>
<div id="app" hidden><aside><a class="brand" href="/desk/">quiet river<span>私人阅读与知识积累</span></a><nav id="nav"><button data-view="recommend" class="selected">优先阅读</button><button data-view="latest">全部更新</button><button data-view="daily">个性化日报</button><button data-view="notes">我的笔记</button><button data-view="sources">关注来源</button><button data-view="health">采集状态</button><button data-view="settings">阅读偏好</button></nav><div class="section-label">阅读主题</div><div id="tags"></div><footer>你的关注，你的顺序。<br><a href="/">旧版时间线</a></footer></aside>
<main><header><div><span class="eyebrow">YOUR SOURCES. YOUR PRIORITIES.</span><h1 id="title">优先阅读</h1><p id="subtitle">全部已发现内容保留，本地算法只决定先读什么。</p></div><button id="refresh">检查更新</button></header><div id="stats" class="stats"></div><div id="task" class="status" role="status" hidden></div><div id="error" class="error" role="alert" hidden></div><section id="content" aria-live="polite"></section><button id="more" hidden>加载更多</button></main></div><div id="toast" role="status" hidden></div></body></html>
