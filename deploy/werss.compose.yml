services:
  werss:
    image: quiet-river/werss:d8feb6a4-sec1
    container_name: quiet-river-werss
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/app/start.sh"]
    env_file:
      - /etc/quiet-river-platform/werss.env
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - /opt/quiet-river-platform/werss-data:/app/data
      - /opt/quiet-river-platform/werss-overrides/apis/mps.py:/app/apis/mps.py:ro
      - /opt/quiet-river-platform/werss-overrides/apis/weread.py:/app/apis/weread.py:ro
    shm_size: 256m
    mem_limit: 1024m
    memswap_limit: 2048m
    security_opt:
      - no-new-privileges:true
